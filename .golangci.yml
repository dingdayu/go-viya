version: "2"

run:
  timeout: 5m
  skip-dirs:
    - examples

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - prealloc
    - nakedret
    - noctx
    - errorlint
    - copyloopvar
    - intrange
    - sloglint
    - revive
