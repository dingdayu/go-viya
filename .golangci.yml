version: "2"

run:
  timeout: 5m

linters:
  exclusions:
    paths:
      - examples
    rules:
      - linters:
          - errcheck
        text: "Error return value of `(os\\.|.*\.Write|.*\.Close|.*\.Body\\.Close|fmt\\.Fprint)`"
      - linters:
          - errorlint
        text: "non-wrapping format verb for fmt.Errorf"
      - linters:
          - revive
        text: "var-naming: method parameter"
      - linters:
          - revive
        text: "var-naming: struct field"
      - linters:
          - revive
        text: "unused-parameter: parameter"
      - linters:
          - revive
        text: "exported: type name will be used"
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - prealloc
    - nakedret
    - noctx
    - errorlint
    - copyloopvar
    - intrange
    - sloglint
    - revive

formatters:
  enable:
    - gofmt
    - goimports
